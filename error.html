<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>页面加载错误</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; }
  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
    background: #f8f9fa;
    color: #333;
    padding: 40px 20px;
  }

  .error-container {
    max-width: 560px;
    width: 100%;
    text-align: center;
    animation: fadeIn 0.4s ease;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(16px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .error-icon {
    font-size: 72px;
    margin-bottom: 24px;
    display: flex;
    justify-content: center;
    gap: 12px;
  }

  .error-icon i {
    opacity: 0.85;
  }

  h1 {
    font-size: 24px;
    font-weight: 600;
    margin-bottom: 12px;
    color: #1a1a1a;
  }

  .error-desc {
    font-size: 15px;
    color: #666;
    margin-bottom: 8px;
    line-height: 1.6;
  }

  .url-text {
    font-size: 13px;
    color: #999;
    word-break: break-all;
    margin-bottom: 28px;
    padding: 10px 14px;
    background: #fff;
    border: 1px solid #e0e0e0;
    border-radius: 6px;
    display: inline-block;
    max-width: 100%;
  }

  .error-detail {
    font-size: 12px;
    color: #aaa;
    margin-bottom: 28px;
    font-family: 'Consolas', 'Courier New', monospace;
  }

  .btn-group {
    display: flex;
    gap: 12px;
    justify-content: center;
    flex-wrap: wrap;
  }

  .btn {
    padding: 10px 28px;
    border: none;
    border-radius: 6px;
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.2s ease;
    text-decoration: none;
    display: inline-flex;
    align-items: center;
    gap: 8px;
  }

  .btn:active {
    transform: scale(0.97);
  }

  .btn-primary {
    background: #007aff;
    color: #fff;
  }
  .btn-primary:hover {
    background: #0062cc;
    box-shadow: 0 2px 8px rgba(0,122,255,0.3);
  }

  .btn-secondary {
    background: #e8e8ed;
    color: #333;
  }
  .btn-secondary:hover {
    background: #d1d1d6;
  }
</style>
</head>
<body>
<div class="error-container">
  <div class="error-icon">
    <i class="fas fa-exclamation-circle" style="color:#e74c3c;"></i>
  </div>
  <h1 id="errorTitle">无法加载页面</h1>
  <p class="error-desc" id="errorDesc">尝试加载页面时出现问题</p>
  <div class="url-text" id="failedUrl"></div>
  <div class="error-detail" id="errorDetail"></div>
  <div class="btn-group">
    <button class="btn btn-primary" id="retryBtn">
      <i class="fas fa-redo"></i> 重新加载
    </button>
    <button class="btn btn-secondary" id="backBtn">
      <i class="fas fa-arrow-left"></i> 返回
    </button>
  </div>
</div>

<script>
  function render() {
    const params = new URLSearchParams(window.location.search)
    const failedUrl = decodeURIComponent(params.get('url') || '')
    const errorCode = params.get('errorCode') || ''
    const errorDesc = params.get('errorDesc') || ''

    // URL
    document.getElementById('failedUrl').textContent = failedUrl

    // 错误标题和描述映射
    const errorMap = {
      // DNS / 网络基础
      'ERR_NAME_NOT_RESOLVED':    { title: '无法访问此网站', desc: '找不到该域名的 IP 地址，请检查域名拼写是否正确' },
      'ERR_DNS_TIMED_OUT':        { title: 'DNS 查询超时', desc: 'DNS 服务器未在合理时间内响应，请检查网络连接或更换 DNS 服务器' },
      'ERR_DNS_SEARCH_EMPTY':     { title: '域名搜索失败', desc: 'DNS 搜索列表为空，无法解析主机名' },
      'ERR_CONNECTION_REFUSED':   { title: '连接被拒绝', desc: '目标服务器主动拒绝了连接请求，可能服务未启动或端口未开放' },
      'ERR_CONNECTION_TIMED_OUT': { title: '连接超时', desc: '连接目标服务器超时，可能是网络延迟过高或服务器无响应' },
      'ERR_CONNECTION_RESET':     { title: '连接被重置', desc: '连接意外中断，目标服务器重置了连接' },
      'ERR_CONNECTION_CLOSED':    { title: '连接已关闭', desc: '连接在完成前被关闭' },
      'ERR_CONNECTION_FAILED':    { title: '连接失败', desc: '与目标服务器建立连接失败' },
      'ERR_ADDRESS_UNREACHABLE':  { title: '地址不可达', desc: '找不到通往该 IP 地址的路由，设备可能未联网' },
      'ERR_ADDRESS_INVALID':      { title: '地址无效', desc: '无法连接到该地址，地址可能格式不正确' },
      'ERR_NETWORK_ACCESS_DENIED':{ title: '网络访问被拒绝', desc: '网络连接被系统安全策略阻止' },
      'ERR_NETWORK_CHANGED':      { title: '网络已变更', desc: '网络连接已经断开，请检查网络连接后重试' },
      'ERR_INTERNET_DISCONNECTED':{ title: '网络已断开', desc: '设备似乎已断开互联网连接，请检查网络设置' },
      'ERR_NETWORK_IO_SUSPENDED': { title: '网络 I/O 已暂停', desc: '网络 I/O 操作被系统暂停（如休眠或后台限制）' },

      // SSL / 证书
      'ERR_CERT_COMMON_NAME_INVALID':  { title: '证书名称不匹配', desc: '网站使用的安全证书域名与当前地址不匹配' },
      'ERR_CERT_DATE_INVALID':         { title: '证书已过期', desc: '网站的安全证书已过期' },
      'ERR_CERT_AUTHORITY_INVALID':    { title: '证书颁发机构无效', desc: '网站的安全证书不被系统信任' },
      'ERR_CERT_REVOKED':              { title: '证书已被吊销', desc: '网站的安全证书已被颁发机构吊销' },
      'ERR_CERT_INVALID':              { title: '证书无效', desc: '网站的安全证书无效，可能存在安全风险' },
      'ERR_CERT_WEAK_SIGNATURE_ALGORITHM': { title: '证书签名算法过弱', desc: '网站使用了不安全的加密签名算法' },
      'ERR_SSL_PROTOCOL_ERROR':        { title: 'SSL 协议错误', desc: '与服务器建立安全连接时发生 TLS/SSL 协议错误' },
      'ERR_SSL_VERSION_OR_CIPHER_MISMATCH': { title: 'SSL 版本/加密套件不匹配', desc: '浏览器与服务器之间无法协商一致的加密协议' },

      // HTTP 状态码类错误
      'ERR_HTTP_403':  { title: '禁止访问 (403)', desc: '没有权限访问此页面' },
      'ERR_HTTP_404':  { title: '页面未找到 (404)', desc: '找不到你请求的页面，可能已被移除或链接错误' },
      'ERR_HTTP_500':  { title: '服务器内部错误 (500)', desc: '服务器遇到了意外错误，无法完成请求' },
      'ERR_HTTP_502':  { title: '网关错误 (502)', desc: '上游服务器返回了无效响应' },
      'ERR_HTTP_503':  { title: '服务不可用 (503)', desc: '服务器暂时无法处理请求，可能是过载或维护中' },
      'ERR_HTTP_504':  { title: '网关超时 (504)', desc: '上游服务器未在超时前响应' },
      'ERR_FAILED':    { title: '请求失败', desc: '网络请求发送失败' },
      'ERR_ABORTED':   { title: '请求已取消', desc: '请求被取消（用户操作或导航中止）' },
      'ERR_FILE_NOT_FOUND': { title: '文件未找到', desc: '请求的文件不存在于本地或远程路径' },
      'ERR_TOO_MANY_REDIRECTS': { title: '重定向次数过多', desc: '页面进入了无限重定向循环' },
      'ERR_EMPTY_RESPONSE': { title: '空响应', desc: '服务器没有返回任何数据' },
      'ERR_RESPONSE_HEADERS_TOO_BIG': { title: '响应头过大', desc: '服务器返回的 HTTP 头部大小超过了限制' },
      'ERR_TUNNEL_CONNECTION_FAILED': { title: '隧道连接失败', desc: '通过代理建立隧道连接时失败' }
    }

    const info = errorMap[errorCode]
    document.getElementById('errorTitle').textContent = info ? info.title : '无法加载页面'
    document.getElementById('errorDesc').textContent = info ? info.desc : (errorDesc || '尝试加载页面时出现问题')

    // 显示错误代码
    if (errorCode) {
      document.getElementById('errorDetail').textContent = errorCode
    }

    // Retry button
    const retryBtn = document.getElementById('retryBtn')
    retryBtn.addEventListener('click', () => {
      if (failedUrl) {
        const { ipcRenderer } = require('electron')
        ipcRenderer.send('navigate-to', failedUrl)
      }
    })

    // Back button
    const backBtn = document.getElementById('backBtn')
    backBtn.addEventListener('click', () => {
      const { ipcRenderer } = require('electron')
      ipcRenderer.send('go-back')
    })
  }

  document.addEventListener('DOMContentLoaded', render)
</script>
</body>
</html>
