name: Build and Release XFBrowser

on:
  push:
    branches:
      - '**'
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    if: ${{ !contains(github.event.head_commit.message, 'chore') }}
    steps:
      - uses: actions/checkout@v4
        name: 检出代码

      - uses: actions/setup-node@v4
        name: 配置 Node.js 环境
        with:
          node-version: 20
          cache: 'npm'

      - name: 安装项目依赖
        run: npm ci

      - name: 安装 Linux 系统依赖
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y rpm libarchive-tools libgtk-3-dev libnotify-dev libasound2-dev

      - name: 构建应用
        run: npm run dist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/upload-artifact@v4
        name: 上传构建产物
        with:
          name: XFBrowser-${{ matrix.os }}
          path: dist/
          retention-days: 30

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4
        name: 检出代码

      - uses: actions/download-artifact@v4  # ✅ 这里修复了
        name: 下载构建产物
        with:
          path: artifacts

      - name: 创建 GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: artifacts/**/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
